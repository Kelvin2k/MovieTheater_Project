
version: "3.8"
services:
  frontend:
    container_name: movie-project-frontend
    build: ./Cinema-Project-FrontEnd
    ports:
      - 3000:80
    networks:
      - cinema-project

  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_DATABASE=${DATABASE_NAME}
    ports:
      - "3308:3306"
    volumes:
      - movie_project_volume:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - cinema-project

  node:
    depends_on:
      - mysql_db
    build: ./Cinema-Project-Backend
    container_name: movie-project-backend
    env_file:
      - ./Cinema-Project-Backend/.env
    ports:
      - "8080:8080"
    networks:
      - cinema-project

volumes:
  movie_project_volume:

networks:
  cinema-project: