name: GlobalPipeline
on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  BACKEND_PATH: ./Cinema-Project-Backend
  FRONTEND_PATH: ./Cinema-Project-FrontEnd
permissions:
  contents: read
jobs:
  # Job check backend 
  buildBackend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and Build Backend
        working-directory: ${{env.BACKEND_PATH}}
        env:
          DATABASE_URL: ${{secrets.DATABASE_URL}}
          VPS_IP: ${{secrets.VPS_IP}}
        run: |
          yarn install
          yarn prisma generate
          yarn run build

  # Job check FrontEnd
  buildFrontEnd:
    runs-on: ubuntu-latest
    needs: [buildBackend]
    steps:
      - uses: actions/checkout@v4
      - name: Install and Build FrontEnd
        working-directory: ${{env.FRONTEND_PATH}}
        env:
          REACT_APP_API_URL: ${{secrets.REACT_APP_API_URL}}
        run: |
            yarn install
            yarn run build

  # Deploy project
  triggerJenkins:
    needs: [buildBackend,buildFrontEnd]
    runs-on: ubuntu-latest
    steps:
      - name:  Trigger Jenkins Deploy
        run: 
          curl -X POST "http://${{secrets.JENKINS_USER}}:${{secrets.JENKINS_API_TOKEN}}@${{secrets.JENKINS_URL}}//job/Deploy-Movie-Project/build?token=${{secrets.JENKINS_JOB_TOKEN}}"





          