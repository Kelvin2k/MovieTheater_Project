name: GlobalPipeline
on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  BACKEND_PATH: ./Cinema-Project-Backend
  FRONTEND_PATH: ./Cinema-Project-FrontEnd
permissions:
  contents: read
jobs:
  # Job check backend 
  buildBackend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and Build Backend
        working-directory: ${{env.BACKEND_PATH}}
        env:
          DATABASE_URL: ${{secrets.DATABASE_URL}}
          VPS_IP: ${{secrets.VPS_IP}}
        run: |
          yarn install
          yarn prisma generate
          yarn run build

  # Job check FrontEnd
  buildFrontEnd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and Build FrontEnd
        working-directory: ${{env.FRONTEND_PATH}}
        env:
          REACT_APP_API_URL: ${{secrets.REACT_APP_API_URL}}
        run: |
            yarn install
            yarn run build

  buildAndPush:
    needs: [buildFrontEnd,buildBackend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Cinema-Project-Backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cinema-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Cinema-Project-FrontEnd
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cinema-frontend:latest

  deployProject:
    needs: [buildAndPush]
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /root/MovieTheater_Project
            docker-compose pull
            docker-compose down
            docker-compose up -d --remove-orphans
            docker image prune -f

